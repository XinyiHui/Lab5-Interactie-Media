<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suzhou</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>

<body class="morning">
  <main class="page">

    <header class="top-bar">
      <span class="logo">SUZHOU</span>
    </header>

    <section class="hero">

      <video id="sceneVideo" muted playsinline></video>
      <div class="video-shade"></div>

      <div class="hero-text">
        <p id="timeOfDay">01 — MORNING</p>

        <h1>
          One City,<br>
          <em>Two Rhythms.</em>
        </h1>

        <div class="equalizer">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="scene-info">
        <span id="sceneNumber">SCENE 01 / 06</span>
        <span id="sceneName">Morning Scene 1</span>
      </div>

    </section>

    <section class="control-panel">

      <p class="small-label">EXPLORE THE SOUNDSCAPE</p>
      <h2>Morning to Night=From Quiet to Noisy</h2>
    
      <div class="buttons">
        <button id="fullBtn">Full Journey</button>
      </div>

      <p id="statusText">
        Press "Full Journey" to begin.
        Adjust the volume or playback position at any time.
      </p>

      <audio id="soundtrack"
             src="sounds/72.mp3"
             controls
             preload="metadata">
      </audio>

      <div class="progress-track">
        <div id="progressBar"></div>
      </div>

    </section>

  </main>
</body>
</html>
